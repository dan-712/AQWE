<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري تجهيز الرابط...</title>
    
    <!-- كود التحقق الخاص بـ Monetag -->
    <meta name="monetag" content="4fecd733f6ba0c6b087def878afcacaf">
    
    <!-- كود التحقق الجديد -->
    <meta name="6a97888e-site-verification" content="b817cff737fa03e3e9ee3af5d0f2d08b">

    <!-- ======================================================= -->
    <!-- [مكان أكواد الـ Popunder للشبكات الثلاث (Adsterra, Monetag, ExoClick)] -->
    <!-- بتنسخ الكود المباشر للـ Popunder من كل شبكة وتحطه هنا بالظبط -->
    <!-- ======================================================= -->

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .ad-box {
            background-color: #e9ecef;
            border: 2px dashed #cccccc;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
        }
        .timer-box {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            padding: 15px;
            background: #eef2ff;
            border-radius: 8px;
        }
        .btn-link {
            display: none;
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            border: none;
        }
        .btn-link:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>انظر أسفله للوصول إلى الرابط المطلوب</h2>
    <p>يرجى الانتظار بضع ثوانٍ لحين تجهيز رابط التحميل/المحتوى الخاص بك.</p>

    <!-- مكان الإعلان الأول (أعلى العداد) -->
    <div class="ad-box">
        [مكان إعلان هيدر / Banner 1]
    </div>

    <!-- صندوق العداد التنازلي (8 ثوانٍ) -->
    <div class="timer-box">
        سيكون الرابط جاهزاً خلال: <span id="countdown">8</span> ثانية
    </div>

    <!-- مكان الإعلان الثاني (وسط) -->
    <div class="ad-box">
        [مكان إعلان وسط / Banner 2]
    </div>

    <!-- الزرار الذي يظهر بعد انتهاء العداد (حط هنا رابط Direct Link الخاص بـ JuicyAds أو أي شبكة) -->
    <a id="downloadBtn" href="https://YOUR-DIRECT-LINK-HERE.com" target="_blank" class="btn-link">
        اضغط هنا للتوجه إلى الرابط الآن
    </a>

    <!-- مكان الإعلان الثالث (أسفل الزر) -->
    <div class="ad-box">
        [مكان إعلان فوتر / Banner 3]
    </div>
</div>

<script>
    // تحديد زمن العداد (8 ثوانٍ)
    var timeLeft = 8;
    var elem = document.getElementById('countdown');
    var btn = document.getElementById('downloadBtn');

    var timerId = setInterval(countdown, 1000);

    function countdown() {
        if (timeLeft == 0) {
            clearTimeout(timerId);
            elem.parentNode.style.display = 'none'; // إخفاء نص العداد
            btn.style.display = 'inline-block'; // إظهار الزرار
        } else {
            elem.innerHTML = timeLeft;
            timeLeft--;
        }
    }
</script>

</body>
</html>
